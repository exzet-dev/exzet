name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-musl, name: x86_64-linux }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, name: aarch64-linux }
          - { runner: macos-latest, target: aarch64-apple-darwin, name: aarch64-macos }
          - { runner: macos-latest, target: x86_64-apple-darwin, name: x86_64-macos }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, name: x86_64-windows }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target "${{ matrix.target }}"
      - if: runner.os != 'Windows'
        run: tar -czf "exzet-${{ matrix.name }}.tar.gz" -C "target/${{ matrix.target }}/release" exzec exzed
      - if: runner.os == 'Windows'
        run: 7z a "exzet-${{ matrix.name }}.zip" ./target/${{ matrix.target }}/release/exzec.exe ./target/${{ matrix.target }}/release/exzed.exe
      - uses: actions/upload-artifact@v4
        with:
          name: exzet-${{ matrix.name }}
          path: exzet-${{ matrix.name }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --title "${TAG#v}" --generate-notes \
            exzet-*.tar.gz exzet-*.zip
