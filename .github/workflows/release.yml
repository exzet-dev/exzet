name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target "$TARGET"
      - run: tar -czf "exzet-${{ matrix.arch }}-linux.tar.gz" -C "target/$TARGET/release" exzec exzed
      - uses: actions/upload-artifact@v4
        with:
          name: exzet-${{ matrix.arch }}-linux
          path: exzet-${{ matrix.arch }}-linux.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --title "${TAG#v}" --generate-notes \
            exzet-*-linux.tar.gz
