[package]
name = "exzet"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
blake3 = "1.8.6"
ignore = "0.4.33"
nfsserve = "0.11.0"
rustix = { version = "1.1.4", features = ["mount", "process", "fs", "system"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "macros", "process", "signal", "time", "fs", "sync"] }
