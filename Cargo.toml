[package]
name = "exzet"
version = "0.0.3"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
blake3 = "1.8.6"
getrandom = "0.3"
ignore = "0.4.33"
nfsserve = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "macros", "process", "signal", "time", "fs", "sync"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["process", "fs", "system"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["mount"] }

[target.'cfg(windows)'.dependencies]
blake3 = { version = "1.8.6", features = ["pure"] }
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
